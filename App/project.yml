# Описание Xcode-проекта для XcodeGen: `cd App && xcodegen generate`.
#
# Сам .xcodeproj в репозиторий не кладём — это генерируемый XML, который
# конфликтует при любом слиянии. Источник правды — этот файл.

name: TenthWord
options:
  bundleIdPrefix: com.tenthword
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: ru

packages:
  ReaderCore:
    path: ../Core
  # Единственная сторонняя зависимость: EPUB — это ZIP, и свой разбор ZIP
  # писать не стали. FB2 и TXT работают без неё.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.0

targets:
  TenthWord:
    type: application
    platform: iOS
    sources:
      - path: TenthWord
      # Словарь лежит рядом с исходниками, а не внутри них: собирается скриптом
      # и в репозиторий не идёт. В бандл кладётся как ресурс.
      - path: ../Data/ru-en.sqlite
        buildPhase: resources
        optional: true
    dependencies:
      - package: ReaderCore
        product: ReaderCore
      - package: ZIPFoundation
        product: ZIPFoundation
    info:
      path: TenthWord/Info.plist
      properties:
        CFBundleDisplayName: Десятое слово
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Экспортное соответствие: своей криптографии нет, HTTPS не в счёт.
        # Без этого ключа App Store Connect спрашивает про шифрование
        # на каждой загрузке сборки.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Импорт книг через Files и «Открыть в…» из других приложений.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Типы книг, которые приложение открывает. Благодаря этому «Десятое слово»
        # появляется в меню «Поделиться» и в «Открыть с помощью».
        CFBundleDocumentTypes:
          - CFBundleTypeName: Книга EPUB
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: Книга FB2
            LSHandlerRank: Owner
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [org.fictionbook.fb2]
          - CFBundleTypeName: Текстовый файл
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.plain-text]
        # FB2 системного типа не имеет — объявляем свой.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.fictionbook.fb2
            UTTypeDescription: Книга FictionBook 2
            UTTypeConformsTo: [public.xml, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [fb2]
              public.mime-type: [application/x-fictionbook+xml]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenthword.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        # Только iPhone. iPad — после первого релиза (docs/ROADMAP.md);
        # заявленная поддержка iPad потребовала бы отдельных скриншотов
        # для ревью и вёрстки в две колонки.
        TARGETED_DEVICE_FAMILY: "1"
        # Подпись автоматическая: Xcode сам берёт сертификат и профиль
        # команды 78LF5PH522 — для отладки Development, для архива
        # Distribution. Задавать CODE_SIGN_IDENTITY руками нельзя:
        # при автоматической подписи это конфликт, сборка падает.
        DEVELOPMENT_TEAM: 78LF5PH522
        CODE_SIGN_STYLE: Automatic

schemes:
  TenthWord:
    build:
      targets:
        TenthWord: all
    run:
      # Покупку можно щёлкать в симуляторе без App Store Connect:
      # StoreKit подставляет товар из этого файла.
      storeKitConfiguration: TenthWord.storekit
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
